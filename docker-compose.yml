version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    container_name: finance_planner_db
    environment:
      POSTGRES_DB: finance_planner
      POSTGRES_USER: finance_user
      POSTGRES_PASSWORD: dev_password_change_in_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_user"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: finance_planner_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@finplanner.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
